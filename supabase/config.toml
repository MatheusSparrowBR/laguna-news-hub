[functions.collect-news]
# verify_jwt = false because the function handles both user JWT and secret key
# authentication internally via the SDK. The Supabase gateway must allow
# requests with apikey (secret key) to reach the function without JWT validation.
verify_jwt = false

[functions.analyze-news]
# verify_jwt = false: the function validates the user JWT internally via
# supabase.auth.getUser(token). This avoids gateway-level JWT rejection
# when the client uses new-style publishable keys (sb_publishable_*) that
# alter the Authorization header flow. CORS is handled manually in the function.
verify_jwt = false
