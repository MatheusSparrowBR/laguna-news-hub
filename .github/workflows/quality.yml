name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (also regenerates TanStack route tree)
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bunx vitest run
